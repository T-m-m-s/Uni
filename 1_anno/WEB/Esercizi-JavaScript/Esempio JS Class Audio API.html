<!DOCTYPE html>
<html lang="en">
<head>
	<title>Esempio JS class Web Audio API</title>
	<meta charset="UTF-8">
</head>
<body>
	<button id="play">Play</button>
	<script>
		// interfaccia
		var playButton = document.getElementById("play");
		playButton.addEventListener("click", PlayAudio);
		// classe oscillatore
		class  Oscillator {
			constructor(context) {
				this.context = context;
			}
			init() {
				// creazione nodi audio: oscillatore e gain
				this.oscillator = new OscillatorNode(this.context);
				this.gainNode = new GainNode(this.context);
				// connessioni
				this.oscillator.connect(this.gainNode);
				this.gainNode.connect(this.context.destination);
				// impostazioni parametri
				this.oscillator.type = "triangle";
			}
			// funzione play 
			play(value, time) {
				this.init();
				this.oscillator.frequency.value = value;
				this.gainNode.gain.setValueAtTime(1, time);
				this.oscillator.start(time);
				this.stop(time);
			}
			// funzione stop 
			stop(time) {
				this.gainNode.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
				this.oscillator.stop(time + 1);
			}
		}
		// creazione audio grafo
		const context = new AudioContext();
		// creazione classe oscillatore e inizializzazione
		var note = new Oscillator(context);
		// funzione play scala (DO RE MI FA SOL LA SI DO)
		function PlayAudio() {
			note.play(261.6, context.currentTime);
			note.play(293.7, context.currentTime + 1);
			note.play(329.6, context.currentTime + 2);
			note.play(349.2, context.currentTime + 3);
			note.play(392.0, context.currentTime + 4);
			note.play(440.0, context.currentTime + 5);
			note.play(493.9, context.currentTime + 6);
			note.play(523.3, context.currentTime + 7);
		}
	</script>
</body>
</html>
